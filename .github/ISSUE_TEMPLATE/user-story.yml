name: 사용자 스토리
description: 기능 작업 이슈
title: "[스토리] "
labels: ["story"]

body:
  - type: textarea
    id: story
    attributes:
      label: 어떤 스토리인가요?
      description: "[사용자]로서, [무엇]을 하고 싶다. [왜냐하면 이유]. 형식으로 작성해주세요."
      placeholder: 예) 결혼이민자로서, 공식 사이트에서 직접 제출한 뒤 '제출 완료'를 눌러 작성 건에 제출 사실을 남기고 싶다. 왜냐하면 지금은 신청 건 진행 상황을 따로 기록할 곳이 없기 때문이다.
    validations:
      required: true

  - type: input
    id: backlog-id
    attributes:
      label: 백로그 ID가 무엇인가요?
      description: 백로그에 등록된 스토리 ID를 적어주세요.
      placeholder: "예: US-05"
    validations:
      required: true

  - type: input
    id: feature
    attributes:
      label: 관련 기능이 무엇인가요?
      description: 이 스토리와 관련된 기능 ID를 적어주세요.
      placeholder: "예: F-06, F-07"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위가 어떻게 되나요?
      description: 이 스토리의 우선순위를 골라주세요.
      options:
        - 필수
        - 선택
    validations:
      required: true

  - type: input
    id: state-transition
    attributes:
      label: 관련 상태 전이가 있나요?
      description: 이 스토리로 바뀌는 상태를 적어주세요.
      placeholder: "예: 작성중 → 검토완료"
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 인수 조건은 무엇인가요?
      description: 이 스토리가 완료되었다고 판단할 수 있는 조건을 적어주세요. 해당하지 않는 항목은 지워주세요.
      value: |
        - [ ] (정상)
        - [ ] (실패·거절)
        - [ ] (권한)
        - [ ] (취소·반려 스토리면) 누가·어떤 조건에서, 상태가 어디로 가는지
        - [ ] (LLM이 있으면) 사람이 확인하기 전에는 상태가 바뀌지 않는다
    validations:
      required: true

  - type: textarea
    id: undecided
    attributes:
      label: 미확정인 것이 있나요?
      description: 아직 정하지 못했거나 논의가 필요한 내용을 적어주세요.
    validations:
      required: false
